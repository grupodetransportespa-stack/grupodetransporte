  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

round: #000000; line-height: 1.6\" data-canvas-width=\"1280\" data-canvas-height=\"5800\">\n\n<header style=\"background: #000000; border-bottom: 1px solid #2A2418; position: sticky; top: 0; z-index: 40\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"#inicio\" style=\"display: flex; align-items: center; text-decoration: none\" aria-label=\"Grupo de Transporte SpA, inicio\">\n<img src=\"1e0b6c20-776b-4779-9fa9-d2261f945884\" alt=\"GDT\" style=\"height: 46px; width: auto; display: block\">\n<\u002Fa>\n<nav aria-label=\"Principal\" style=\"display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; font-size: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase\">\n<a href=\"#por-que-nosotros\" style=\"color: #ECE6D8; text-decoration: none\">Por qué nosotros<\u002Fa>\n<a href=\"#clientes\" style=\"color: #ECE6D8; text-decoration: none\">Clientes<\u002Fa>\n<a href=\"#servicios\" style=\"color: #ECE6D8; text-decoration: none\">Servicios<\u002Fa>\n<a href=\"#trabaja-aqui\" style=\"color: #ECE6D8; text-decoration: none\">Trabaja aquí<\u002Fa>\n<a href=\"#contacto\" style=\"background: linear-gradient(180deg, #F3D27A 0%, #D4A537 55%, #B8861F 100%); color: #000000; text-decoration: none; padding: 12px 22px; border-radius: 999px; font-weight: 600\">Cotizar<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"inicio\" style=\"padding: 80px 24px 64px; background: linear-gradient(180deg, #1A150B 0%, #000000 60%)\">\n<div style=\"max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 1 1 520px; min-width: 0\">\n<p style=\"margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: #E2B54A\">Primera y última milla<\u002Fp>\n<h1 style=\"margin: 0; font-family: 'Saira', 'Arial Narrow', sans-serif; font-style: italic; font-weight: 800; font-size: clamp(48px, 7vw, 84px); line-height: 1; text-transform: uppercase; color: #FFFFFF\">Tu negocio llega <span style=\"color: #E2B54A\">más lejos<\u002Fspan><\u002Fh1>\n<p style=\"margin: 18px 0 0; font-size: 20px; color: #CFC8B8; max-width: 540px\">La experiencia de tu cliente llega en cada despacho. Retiramos en origen y entregamos en destino con 98% de efectividad.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px\">\n<a href=\"#contacto\" style=\"background: linear-gradient(180deg, #F3D27A 0%, #D4A537 55%, #B8861F 100%); color: #000000; text-decoration: none; padding: 16px 32px; border-radius: 999px; font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 0.04em\">Solicitar cotización<\u002Fa>\n<a href=\"#servicios\" style=\"color: #E2B54A; text-decoration: none; padding: 15px 31px; border-radius: 999px; font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: 0.04em; border: 1px solid #B8861F\">Ver servicios<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 460px; min-width: 0\">\n<img src=\"e6997ab7-6d55-4a65-a968-2f389a07a732\" alt=\"Conductor de GDT entregando una caja a una clienta\" style=\"width: 100%; height: auto; display: block; border-radius: 14px; border: 1px solid #3A3020\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"por-que-nosotros\" style=\"padding: 88px 24px; background: #0D0B07; border-top: 1px solid #2A2418; border-bottom: 1px solid #2A2418\">\n<div style=\"max-width: 1180px; margin: 0 auto\">\n<h2 style=\"margin: 0 0 12px; font-family: 'Saira', 'Arial Narrow', sans-serif; font-style: italic; font-weight: 800; font-size: 46px; text-transform: uppercase; line-height: 1.05; color: #E2B54A\">Por qué nosotros<\u002Fh2>\n<p style=\"margin: 0 0 44px; font-size: 18px; color: #CFC8B8; max-width: 660px\">Empresas grandes confían en nosotros porque medimos todo, cumplimos metas y hacemos que la entrega sea parte de tu estrategia.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px\">\n<div style=\"background: #0F0D09; border: 1px solid #3A3020; border-radius: 14px; padding: 28px\">\n<div style=\"font-family: 'Saira', 'Arial Narrow', sans-serif; font-style: italic; font-weight: 800; font-size: 56px; line-height: 1; color: #E2B54A\">+98%<\u002Fdiv>\n<div style=\"margin-top: 10px; font-size: 19px; font-weight: 600; color: #FFFFFF\">Efectividad de entrega<\u002Fdiv>\n<p style=\"margin: 6px 0 0; color: #B8B0A0\">Envíos entregados con éxito sobre el total despachado.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #0F0D09; border: 1px solid #3A3020; border-radius: 14px; padding: 28px\">\n<div style=\"font-family: 'Saira', 'Arial Narrow', sans-serif; font-style: italic; font-weight: 800; font-size: 56px; line-height: 1; color: #E2B54A\">100%<\u002Fdiv>\n<div style=\"margin-top: 10px; font-size: 19px; font-weight: 600; color: #FFFFFF\">KPI cumplidos<\u002Fdiv>\n<p style=\"margin: 6px 0 0; color: #B8B0A0\">Metas de servicio acordadas y cumplidas cada mes.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #0F0D09; border: 1px solid #3A3020; border-radius: 14px; padding: 28px\">\n<svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E2B54A\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z\"><\u002Fpath><path d=\"M12.5 7H11v6l5.2 3.2\"><\u002Fpath><\u002Fsvg>\n<div style=\"margin-top: 10px; font-size: 19px; font-weight: 600; color: #FFFFFF\">Entregas a tiempo<\u002Fdiv>\n<p style=\"margin: 6px 0 0; color: #B8B0A0\">Cumplimos plazos. Cada entrega confirmada y trazada.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #0F0D09; border: 1px solid #3A3020; border-radius: 14px; padding: 28px\">\n<svg width=\"56\" height=\ style>\n<\u002Fdiv><\u002Fsection>\n\n<section id=\"servicios\" style=\"padding: 88px 24px\">\n<div style=\"max-width: 1180px; margin: 0 auto\">\n<h2 style=\"margin: 0; font-family: 'Saira', 'Arial Narrow', sans-serif; font-style: italic; font-weight: 800; font-size: 46px; text-transform: uppercase; line-height: 1.05; color: #E2B54A\">Nuestros servicios<\u002Fh2>\n<p style=\"margin: 12px 0 40px; font-size: 18px; color: #CFC8B8; max-width: 640px\">Soluciones para empresas que necesitan mover carga de forma confiable y profesional.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 20px\">\n<div style=\"background: #0F0D09; border-radius: 14px; padding: 32px; border: 1px solid #3A3020\">\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E2B54A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 8l-9-5-9 5v8l9 5 9-5z\"><\u002Fpath><path d=\"M3 8l9 5 9-5\"><\u002Fpath><path d=\"M12 13v8\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 16px 0 8px; font-size: 20px; color: #FFFFFF\">Primera milla<\u002Fh3>\n<p style=\"margin: 0; color: #B8B0A0\">Retiro de mercadería en proveedores, fábricas, bodegas o tiendas, con traslado a tu centro de distribución.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #0F0D09; border-radius: 14px; padding: 32px; border: 1px solid #3A3020\">\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E2B54A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l9-7 9 7\"><\u002Fpath><path d=\"M5 10v10h14V10\"><\u002Fpath><path d=\"M10 20v-6h4v6\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 16px 0 8px; font-size: 20px; color: #FFFFFF\">Última milla<\u002Fh3>\n<p style=\"margin: 0; color: #B8B0A0\">Entrega de pedidos a domicilio o en local de clientes, con confirmación de recepción.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #0F0D09; border-radius: 14px; padding: 32px; border: 1px solid #3A3020\">\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E2B54A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"20\" r=\"1.4\"><\u002Fcircle><circle cx=\"18\" cy=\"20\" r=\"1.4\"><\u002Fcircle><path d=\"M2 3h3l2.6 12h11.4l2-8H6.4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 16px 0 8px; font-size: 20px; color: #FFFFFF\">Logística e-commerce<\u002Fh3>\n<p style=\"margin: 0; color: #B8B0A0\">Retiros y despachos programados, adaptados a tu volumen de pedidos.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"como-funciona\" style=\"padding: 88px 24px; background: #0D0B07; border-top: 1px solid #2A2418; border-bottom: 1px solid #2A2418\">\n<div style=\"max-width: 1180px; margin: 0 auto\">\n<h2 style=\"margin: 0 0 40px; font-family: 'Saira', 'Arial Narrow', sans-serif; font-style: italic; font-weight: 800; font-size: 46px; text-transform: uppercase; line-height: 1.05; color: #E2B54A\">Cómo funciona<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px\">\n<div>\n<div style=\"font-family: 'Saira', sans-serif; font-style: italic; font-size: 56px; font-weight: 800; color: #E2B54A; line-height: 1\">1<\u002Fdiv>\n<h3 style=\"margin: 12px 0 6px; font-size: 20px; color: #FFFFFF\">Cotiza<\u002Fh3>\n<p style=\"margin: 0; color: #B8B0A0\">Cuéntanos qué necesitas mover, desde dónde, hacia dónde y con qué frecuencia.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'Saira', sans-serif; font-style: italic; font-size: 56px; font-weight: 800; color: #E2B54A; line-height: 1\">2<\u002Fdiv>\n<h3 style=\"margin: 12px 0 6px; font-size: 20px; color: #FFFFFF\">Coordinamos<\u002Fh3>\n<p style=\"margin: 0; color: #B8B0A0\">Definimos horarios de retiro y rutas de entrega según tu operación.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'Saira', sans-serif; font-style: italic; font-size: 56px; font-weight: 800; color: #E2B54A; line-height: 1\">3<\u002Fdiv>\n<h3 style=\"margin: 12px 0 6px; font-size: 20px; color: #FFFFFF\">Entregamos<\u002Fh3>\n<p style=\"margin: 0; color: #B8B0A0\">Retiramos, trasladamos y entregamos, manteniéndote informado en cada etapa.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"trabaja-aqui\" style=\"padding: 88px 24px\">\n<div style=\"max-width: 1180px; margin: 0 auto\">\n<p style=\"margin: 0 0 8px; font-size: 14px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #CFC8B8\">Únete a nuestro equipo<\u002Fp>\n<h2 style=\"margin: 0 0 28px; font-family: 'Saira', 'Arial Narrow', sans-serif; font-style: italic; font-weight: 800; font-size: 46px; text-transform: uppercase; line-height: 1.05; color: #E2B54A\">Trabaja aquí<\u002Fh2>\n<p style=\"margin: 0 0 44px; font-size: 19px; color: #CFC8B8; max-width: 640px\">Estamos buscando chóferes profesionales y responsables para ampliar nuestro equipo. Trabaja con nosotros y sé parte del transporte que avanza.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px\">\n<div style=\"background: #0F0D09; border: 1px solid #3A3020; border-radius: 14px; padding: 32px\">\n<h3 style=\"margin: 0 0 16px; font-size: 22px; font-weight: 700; color: #E2B54A\">¿Por qué unirte?<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; gap: 12px\">\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E2B54A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n<div><div style=\"font-weight: 600; color: #FFFFFF\">Salario competitivo<\u002Fdiv><p style=\"margin: 2px 0 0; font-size: 14px; color: #B8B0A0\">Según licencia y experiencia.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px\">\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E2B54A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n<div><div style=\"font-weight: 600; color: #FFFFFF\">Capacitación<\u002Fdiv><p style=\"margin: 2px 0 0; font-size: 14px; color: #B8B0A0\">Entrenamiento continuo en seguridad.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px\">\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E2B54A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n<div><div style=\"font-weight: 600; color: #FFFFFF\">Beneficios y estabilidad<\u002Fdiv><p style=\"margin: 2px 0 0; font-size: 14px; color: #B8B0A0\">Contrato, seguridad social, bonificaciones.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px\">\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E2B54A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n<div><div style=\"font-weight: 600; color: #FFFFFF\">Flexibilidad laboral<\u002Fdiv><p style=\"margin: 2px 0 0; font-size: 14px; color: #B8B0A0\">Horarios regulares, sin sorpresas.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #0F0D09; border: 1px solid #3A3020; border-radius: 14px; padding: 32px; display: flex; flex-direction: column\">\n<h3 style=\"margin: 0 0 20px; font-size: 22px; font-weight: 700; color: #E2B54A\">Requisitos<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px\">\n<li style=\"color: #CFC8B8\">Licencia de conducir (A2, B o uto; display: flex; flex-wrap: wrap; gap: 48px\">\n<div style=\"flex: 1 1 380px; min-width: 0\">\n<h2 style=\"margin: 0; font-family: 'Saira', 'Arial Narrow', sans-serif; font-style: italic; font-weight: 800; font-size: 46px; text-transform: uppercase; line-height: 1.05; color: #E2B54A\">Solicita tu cotización<\u002Fh2>\n<p style=\"margin: 12px 0 32px; font-size: 18px; color: #CFC8B8\">Respondemos a la brevedad.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 14px; font-size: 17px\">\n<a href=\"tel:+56938762271\" style=\"color: #FFFFFF; text-decoration: none; display: flex; gap: 12px; align-items: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E2B54A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2\"><\u002Fpath><\u002Fsvg>+56 9 3876 2271<\u002Fa>\n<a href=\"mailto:contacto@grupodetransporte.cl\" style=\"color: #FFFFFF; text-decoration: none; display: flex; gap: 12px; align-items: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E2B54A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M3 7l9 6 9-6\"><\u002Fpath><\u002Fsvg>contacto@grupodetransporte.cl<\u002Fa>\n<a href=\"https://www.google.com/maps/search/?api=1&amp;query=Los+Militares+4611+Las+Condes+Chile\" style=\"color: #FFFFFF; text-decoration: none; display: flex; gap: 12px; align-items: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E2B54A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\u002Fcircle><\u002Fsvg>Los Militares 4611, Las Condes, Chile<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 440px; min-width: 0; background: #0F0D09; border: 1px solid #3A3020; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; color: #ECE6D8\">Nombre o empresa<input type=\"text\" style=\"font: inherit; font-weight: 400; font-size: 16px; padding: 12px 14px; border: 1px solid #4A3F2A; border-radius: 8px; background: #000000; color: #FFFFFF\"><\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; color: #ECE6D8\">Teléfono o correo<input type=\"text\" style=\"font: inherit; font-weight: 400; font-size: 16px; padding: 12px 14px; border: 1px solid #4A3F2A; border-radius: 8px; background: #000000; color: #FFFFFF\"><\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; color: #ECE6D8\">Servicio\n<sc-raw-select style=\"font: inherit; font-weight: 400; font-size: 16px; padding: 12px 14px; border: 1px solid #4A3F2A; border-radius: 8px; background: #000000; color: #FFFFFF\"><option>Primera milla<\u002Foption><option>Última milla<\u002Foption><option>Ambos<\u002Foption><option>E-commerce<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; color: #ECE6D8\">¿Qué necesitas mover?<textarea rows=\"4\" style=\"font: inherit; font-weight: 400; font-size: 16px; padding: 12px 14px; border: 1px solid #4A3F2A; border-radius: 8px; resize: vertical; background: #000000; color: #FFFFFF\"><\u002Ftextarea><\u002Flabel>\n<button type=\"button\" style=\"background: linear-gradient(180deg, #F3D27A 0%, #D4A537 55%, #B8861F 100%); color: #000000; border: none; padding: 16px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer\">Enviar solicitud<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #0D0B07; border-top: 1px solid #2A2418; padding: 48px 24px 32px\">\n<div style=\"max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center\">\n<img src=\"ceefbc2c-e1bf-4e87-bcf7-f3523445e4a4\" alt=\"Grupo de Transporte SpA, logística que avanza\" style=\"width: 100%; max-width: 360px; height: auto; display: block\">\n<span style=\"color: #A9A296; font-size: 14px\">© 2026 Grupo de Transporte SpA • Logística que avanza<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:5800}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { indiceClientes: 0, mostrarCampoVehiculo: false };\n  }\n  componentDidMount() {\n    this.intervalo = setInterval(() => {\n      this.setState({ indiceClientes: (this.state.indiceClientes + 1) % 5 });\n    }, 6000);\n  }\n  componentWillUnmount() {\n    if (this.intervalo) clearInterval(this.intervalo);\n  }\n  renderVals() {\n    const clientes = [\n      { id: 'chilexpress', url: '/_blob/48636624d7bee2c5839f5f76f74d34d2' },\n      { id: '99minutos', url: '/_blob/b95a4135748f7e70c4d2997bef679b77' },\n      { id: 'mercadolibre', url: '/_blob/a57888caf742755bc44fa779bbe16022' },\n      { id: 'correos', url: '/_blob/0884f13d61b062e2b13020025dd50f1d' },\n      { id: 'starken', url: '/_blob/2dd14bb7b0136161e7c2de4c3d19b7b2' }\n    ];\n    const idx = this.state.indiceClientes;\n    const logoEl = document.getElementById('logoSlide');\n    if (logoEl) logoEl.src = clientes[idx].url;\n    \n    return {\n      logoActual: clientes[idx].url,\n      mostrarCampoVehiculo: this.state.mostrarCampoVehiculo,\n      mostrarVehiculo: (e) => this.setState({ mostrarCampoVehiculo: e.target.value === 'si' }),\n      enviarPostulacion: () => {\n        const form = document.getElementById('formChofer');\n        const nombre = form.querySelector('input[name=\"nombre\"]').value;\n        const telefono = form.querySelector('input[name=\"telefono\"]').value;\n        const email = form.querySelector('input[name=\"email\"]').value;\n        const comuna = form.querySelector('select[name=\"comuna\"]').value;\n        const licencia = form.querySelector('select[name=\"licencia\"]').value;\n        const vehiculoPropio = form.querySelector('select[name=\"vehiculo_propio\"]').value;\n        const tipoVehiculo = form.querySelector('select[name=\"tipo_vehiculo\"]') ? form.querySelector('select[name=\"tipo_vehiculo\"]').value : '';\n        const experiencia = form.querySelector('input[name=\"experiencia\"]').value;\n        const comentarios = form.querySelector('textarea[name=\"comentarios\"]').value;\n        \n        if (!nombre || !telefono || !email || !comuna || !licencia) {\n          alert('Por favor completa todos los campos requeridos.');\n          return;\n        }\n        \n        const asunto = `Postulación Chofer - ${comuna} - Licencia ${licencia}`;\n        const cuerpo = `Nombre: ${nombre}%0ATeléfono: ${telefono}%0ACorreo: ${email}%0AComuna: ${comuna}%0ALicencia: ${licencia}%0A¿Vehículo propio?: ${vehiculoPropio}${tipoVehiculo ? `%0ATipo de vehículo: ${tipoVehiculo}` : ''}%0AExperiencia: ${experiencia} años%0AComentarios: ${comentarios}`;\n        \n        const mailtoLink = `mailto:contacto@grupodetransporte.cl?subject=${encodeURIComponent(asunto)}&body=${cuerpo}`;\n        window.location.href = mailtoLink;\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
